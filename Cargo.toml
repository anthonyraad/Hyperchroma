[package]
name = "hyperchroma"
version = "0.1.0"
edition = "2021"
authors = ["Raadscapes"]
license = "GPL-3.0-or-later"
description = "Polyphonic random-slice instrument for ambient and botanica music"
publish = false

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hyperchroma-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = []
# Standalone app with system audio and MIDI. The VST3/CLAP bundle does not need it.
standalone = ["nih_plug/standalone"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
rtrb = "0.3"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm"] }

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
